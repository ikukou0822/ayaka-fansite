<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a171c" media="(prefers-color-scheme: dark)">
  <title>AYAKA（彩花）非公式応援サイト｜NiziU</title>
  <meta name="description" content="NiziU AYAKA（彩花）の非公式応援サイト。プロフィール、バースデーカウントダウン、ヒストリー、フォト、ビデオ通話の思い出、応援メッセージ。">
  <!-- 分享預覽（Open Graph / Twitter Card）。網址換了的話，下面的絕對網址也要一起改。 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AYAKA（彩花）非公式応援サイト">
  <meta property="og:title" content="AYAKA（彩花）非公式応援サイト｜NiziU">
  <meta property="og:description" content="NiziU AYAKA（彩花）の非公式応援サイト。プロフィール、バースデーカウントダウン、ヒストリー、フォト、ビデオ通話の思い出、応援メッセージ。">
  <meta property="og:url" content="https://ikukou0822.github.io/ayaka-fansite/">
  <meta property="og:image" content="https://ikukou0822.github.io/ayaka-fansite/photos/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="AYAKA（満面の笑顔）">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AYAKA（彩花）非公式応援サイト｜NiziU">
  <meta name="twitter:description" content="NiziU AYAKA（彩花）の非公式応援サイト。プロフィール、バースデーカウントダウン、ヒストリー、フォト、ビデオ通話の思い出、応援メッセージ。">
  <meta name="twitter:image" content="https://ikukou0822.github.io/ayaka-fansite/photos/og.jpg">
  <link rel="canonical" href="https://ikukou0822.github.io/ayaka-fansite/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <noscript><link rel="stylesheet" href="nojs.css"></noscript>
</head>
<body>
  <a class="skip-link" href="#main" data-ui="skipLink"></a>
  <noscript>
    <p class="noscript" lang="ja">このサイトはJavaScriptを使用しています。ブラウザのJavaScriptを有効にしてご覧ください。</p>
    <p class="noscript" lang="zh-Hant">本網站需要啟用 JavaScript 才能正常顯示。</p>
  </noscript>

  <header class="site-header site-header--nav">
    <div class="site-header__inner">
      <a class="brand" href="#top">
        <svg class="brand__mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M12 46a20 20 0 0 1 40 0" fill="none" stroke="#f3b9c9" stroke-width="4" stroke-linecap="round"/>
          <g fill="#f1a8bc"><circle cx="32" cy="22" r="6.5"/><circle cx="41.5" cy="29" r="6.5"/><circle cx="37.9" cy="40.2" r="6.5"/><circle cx="26.1" cy="40.2" r="6.5"/><circle cx="22.5" cy="29" r="6.5"/></g>
          <circle cx="32" cy="32" r="5" fill="#fff6e3"/>
        </svg>
        <span class="brand__name" data-hero="name"></span>
        <span class="brand__sub" data-ui="brandSub"></span>
      </a>
      <div class="lang-switch" role="group" data-ui-aria-label="langLabel">
        <button type="button" class="lang-switch__btn" data-lang="ja" aria-pressed="false" data-ui="langJa" lang="ja"></button>
        <button type="button" class="lang-switch__btn" data-lang="zh" aria-pressed="false" data-ui="langZh" lang="zh-Hant"></button>
      </div>
      <nav class="site-nav" data-ui-aria-label="navLabel">
        <ul class="site-nav__list" role="list">
          <li><a href="#profile" data-ui="navProfile"></a></li>
          <li><a href="#birthday" data-ui="navBirthday"></a></li>
          <li><a href="#timeline" data-ui="navTimeline"></a></li>
          <li><a href="#works" data-ui="navWorks"></a></li>
          <li><a href="#gallery" data-ui="navGallery"></a></li>
          <li><a href="#messages" data-ui="navMessages"></a></li>
          <li><a href="#about" data-ui="navAbout"></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">

    <section id="top" class="hero" aria-labelledby="hero-name" tabindex="-1">
      <div class="hero__inner">
        <div class="hero__text">
          <p class="hero__eyebrow" data-hero="eyebrow"></p>
          <h1 class="hero__name" id="hero-name">
            <span class="hero__name-latin" data-hero="name"></span>
            <span class="hero__name-jp">
              <span class="hero__name-kanji" data-hero="nameKanji"></span>
              <span class="hero__name-kana" data-hero="nameKana" lang="ja"></span>
            </span>
          </h1>
          <p class="hero__slogan" data-hero="slogan"></p>
          <p class="hero__note" data-hero="sloganNote" hidden></p>
          <p class="hero__cta"><a class="link-arrow" href="#gallery" data-ui="heroCta"></a></p>
        </div>
        <figure class="hero__figure">
          <div class="hero__frame">
            <picture>
              <source id="hero-source" type="image/webp" srcset="photos/ayaka-07-480.webp 480w, photos/ayaka-07-800.webp 800w, photos/ayaka-07-1024.webp 1024w, photos/ayaka-07-full.webp 1280w" sizes="(min-width: 1100px) 460px, (min-width: 720px) clamp(360px, 41vw, 460px), (min-width: 560px) and (orientation: landscape) 41vw, min(92vw, 40vh)">
              <img class="hero__img" id="hero-img" src="photos/ayaka-07.jpg" alt="満面の笑顔" width="1280" height="1600" loading="eager" fetchpriority="high" decoding="async">
            </picture>
          </div>
          <figcaption class="hero__caption" id="hero-caption"></figcaption>
        </figure>
      </div>
    </section>

    <section id="profile" class="section" aria-labelledby="profile-title" tabindex="-1">
      <div class="section__inner">
        <header class="section__head">
          <h2 class="section__title" id="profile-title" data-ui="profileTitle"></h2>
          <p class="section__lead" data-ui="profileLead"></p>
        </header>
        <div class="profile-body">
          <dl class="profile" id="profile-list"></dl>
          <!-- 有年份的興趣（data.js 的 hobbies）；沒有資料時整塊隱藏 -->
          <div class="block" id="profile-hobbies">
            <h3 class="block__title" data-ui="hobbiesTitle"></h3>
            <p class="block__lead" data-ui="hobbiesLead"></p>
            <dl class="profile profile--notes" id="hobbies-list"></dl>
          </div>
          <!-- 出處：預設收合，內容由 app.js 依 data.js 的 sources 填入 -->
          <details class="sources" id="profile-sources">
            <summary class="sources__summary" data-ui="sourcesSummary"></summary>
            <ul class="sources__list" id="profile-sources-list" role="list"></ul>
          </details>
        </div>
      </div>
    </section>

    <section id="birthday" class="section section--soft" aria-labelledby="birthday-title" tabindex="-1">
      <div class="section__inner">
        <header class="section__head">
          <h2 class="section__title" id="birthday-title" data-ui="birthdayTitle"></h2>
        </header>
        <div class="birthday" id="birthday-box">
          <div class="birthday__countdown" id="birthday-countdown">
            <p class="birthday__lead" id="birthday-lead"></p>
            <div class="countdown" role="timer" aria-live="off" id="countdown">
              <div class="countdown__tile"><span class="countdown__num" data-unit="days">0</span><span class="countdown__unit" data-ui="unitDays"></span></div>
              <div class="countdown__tile"><span class="countdown__num" data-unit="hours">0</span><span class="countdown__unit" data-ui="unitHours"></span></div>
              <div class="countdown__tile"><span class="countdown__num" data-unit="minutes">0</span><span class="countdown__unit" data-ui="unitMinutes"></span></div>
              <!-- 訪客開啟「減少動態效果」時不顯示每秒跳動的秒數（styles.css） -->
              <div class="countdown__tile countdown__tile--seconds"><span class="countdown__num" data-unit="seconds">0</span><span class="countdown__unit" data-ui="unitSeconds"></span></div>
            </div>
            <p class="birthday__until" id="birthday-until"></p>
          </div>
          <div class="birthday__today" id="birthday-today" hidden>
            <p class="birthday__greeting" id="birthday-greeting"></p>
            <p class="birthday__greeting-lead" id="birthday-greeting-lead"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="timeline" class="section" aria-labelledby="timeline-title" tabindex="-1">
      <div class="section__inner">
        <header class="section__head">
          <h2 class="section__title" id="timeline-title" data-ui="timelineTitle"></h2>
          <p class="section__lead" data-ui="timelineLead"></p>
        </header>
        <div class="timeline-body">
          <ol class="timeline" id="timeline-list" role="list"></ol>
          <details class="sources sources--timeline" id="timeline-sources">
            <summary class="sources__summary" data-ui="sourcesSummary"></summary>
            <ul class="sources__list" id="timeline-sources-list" role="list"></ul>
          </details>
        </div>
      </div>
    </section>

    <!-- 作品與訪談（data.js 的 works、interviews）：文字與外部連結，不放官方圖片、歌詞或嵌入元件 -->
    <section id="works" class="section section--line" aria-labelledby="works-title" tabindex="-1">
      <div class="section__inner">
        <header class="section__head">
          <h2 class="section__title" id="works-title" data-ui="worksTitle"></h2>
          <p class="section__lead" data-ui="worksLead"></p>
        </header>
        <div class="works-body">
          <div class="block block--first">
            <h3 class="block__title" data-ui="worksListTitle"></h3>
            <div class="entries" id="works-list"></div>
          </div>
          <div class="block">
            <h3 class="block__title" data-ui="interviewsTitle"></h3>
            <p class="block__lead" data-ui="interviewsLead"></p>
            <div class="entries" id="interviews-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="gallery" class="section section--soft" aria-labelledby="gallery-title" tabindex="-1">
      <div class="section__inner">
        <header class="section__head">
          <h2 class="section__title" id="gallery-title" data-ui="galleryTitle"></h2>
          <p class="section__lead" data-ui="galleryLead"></p>
        </header>
        <p id="gallery-hint" hidden></p>
        <!-- 第一組（活動照片）的日期：整組同一天時只在這裡寫一次，每張底下不再重複 -->
        <p class="gallery__meta" id="gallery-date" hidden></p>
        <ul class="gallery" id="gallery-grid" role="list"></ul>
        <!-- 第二組：視訊回憶（data.js 的 callPhotos） -->
        <div class="gallery-group" id="gallery-call">
          <header class="gallery-group__head">
            <div class="gallery-group__row">
              <h3 class="gallery-group__title" id="gallery-call-title" data-ui="galleryCallTitle"></h3>
              <time class="gallery-group__date" id="gallery-call-date"></time>
            </div>
            <p class="gallery-group__lead" data-ui="galleryCallLead"></p>
          </header>
          <ul class="gallery" id="gallery-grid-call" role="list" aria-labelledby="gallery-call-title gallery-call-date"></ul>
        </div>
      </div>
    </section>

    <section id="messages" class="section" aria-labelledby="messages-title" tabindex="-1">
      <div class="section__inner">
        <header class="section__head">
          <h2 class="section__title" id="messages-title" data-ui="messagesTitle"></h2>
        </header>
        <div class="messages__body">
          <!-- data.js 的 messages 是空的時候，這個清單會隱藏，只剩下面的入口小卡 -->
          <ul class="messages" id="messages-list" role="list" hidden></ul>
          <!-- 「彩花ちゃんへの手紙」（letter.html）の入口。文字は data.js の ui.letterEntry*（信的內容在 letter-data.js） -->
          <a class="letter-entry" href="letter.html">
            <span class="letter-entry__title" data-ui="letterEntryTitle"></span>
            <span class="letter-entry__text" data-ui="letterEntryText"></span>
            <span class="letter-entry__cta" data-ui="letterEntryCta"></span>
          </a>
          <!-- 合言葉のページ（別のサイト）への入口：小さな文字リンクだけ。data.js の site.roomUrl が空のあいだは表示しない -->
          <p class="room-entry" id="room-entry" hidden><a rel="nofollow" data-ui="roomEntry"></a></p>
        </div>
      </div>
    </section>

    <section id="about" class="section section--soft" aria-labelledby="about-title" tabindex="-1">
      <div class="section__inner section__inner--narrow">
        <header class="section__head">
          <h2 class="section__title" id="about-title" data-ui="aboutTitle"></h2>
        </header>
        <div class="about__body">
          <div class="prose" id="about-text"></div>
          <!-- 官方連結（data.js 的 links）：外部連結，新分頁開啟 -->
          <div class="links" id="official-links">
            <h3 class="links__title" data-ui="linksTitle"></h3>
            <ul class="links__list" id="links-list" role="list"></ul>
            <p class="links__note" id="links-note" hidden></p>
          </div>
          <div class="share">
            <p class="share__lead" data-ui="shareLead"></p>
            <div class="share__row">
              <button type="button" class="share__btn" id="share-btn">
                <svg class="share__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                  <path d="M12 15V3M8 7l4-4 4 4M5 11v8a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="share__label" data-ui="shareButton"></span>
              </button>
              <p class="share__status" id="share-status" aria-live="polite" aria-atomic="true"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__brand" data-hero="name"></p>
      <p class="site-footer__line" id="footer-disclaimer"></p>
      <p class="site-footer__line" id="footer-photo"></p>
      <p class="site-footer__meta" id="footer-updated"></p>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" data-ui-aria-label="lightboxLabel" tabindex="-1">
    <div class="lightbox__bar">
      <p class="lightbox__counter" id="lightbox-counter" aria-hidden="true"></p>
      <p class="visually-hidden" id="lightbox-status" aria-live="polite" aria-atomic="true"></p>
    </div>
    <figure class="lightbox__figure">
      <div class="lightbox__stage" id="lightbox-stage">
        <picture>
          <source id="lightbox-source" type="image/webp">
          <img class="lightbox__img" id="lightbox-img" alt="" width="1280" height="1600" decoding="async">
        </picture>
      </div>
      <figcaption class="lightbox__caption">
        <span class="lightbox__caption-text" id="lightbox-caption" aria-hidden="true"></span>
        <span class="lightbox__caption-date" id="lightbox-date"></span>
      </figcaption>
    </figure>
    <p class="lightbox__hint lightbox__hint--keys" data-ui="lightboxHint"></p>
    <p class="lightbox__hint lightbox__hint--touch" data-ui="lightboxHintTouch"></p>
    <div class="lightbox__nav">
      <button type="button" class="lightbox__btn lightbox__btn--prev" id="lightbox-prev"><span class="visually-hidden" data-ui="lightboxPrev"></span></button>
      <button type="button" class="lightbox__btn lightbox__btn--close" id="lightbox-close"><span class="visually-hidden" data-ui="lightboxClose"></span></button>
      <button type="button" class="lightbox__btn lightbox__btn--next" id="lightbox-next"><span class="visually-hidden" data-ui="lightboxNext"></span></button>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="countdown.js"></script>
  <script src="share.js"></script>
  <script src="app.js"></script>
</body>
</html>
